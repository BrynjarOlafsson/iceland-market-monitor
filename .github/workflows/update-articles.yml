name: Update market research articles

on:
  workflow_dispatch:
  # Enable automatic daily checks after the first successful live run:
  # schedule:
  #   - cron: '37 11 * * *'

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Find verified new publications
        run: python update_articles.py
      - name: Commit article updates if present
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          if git diff --cached --quiet; then
            echo "No newly verified publications"
          else
            git commit -m "Update publication archive"
            git push
          fi
